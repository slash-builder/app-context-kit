# Release the Rust crate to crates.io by trusted publishing (no stored token). The crate is in rust/.
# Only the Rust crate is published here; the Dart packages are not on pub.dev.
# Standard: context/rust-and-crates-io-standard.md
# Prerequisites (once per crate): the FIRST publish is done by hand by a maintainer; then, on crates.io, add this
# repository, this workflow file name (release.yml) and the environment name (release) as a trusted publisher.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: The tag must equal the version in Cargo.toml
        run: |
          set -eu
          v="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version $v"; exit 1; }
      - run: cargo test --all-features --locked
      - run: cargo publish --dry-run --locked
      - run: cargo package --list --locked   # reviewers read this list: nothing internal may ship

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release            # protect with required reviewers in the repository settings
    defaults:
      run:
        working-directory: rust
    permissions:
      contents: read
      id-token: write               # lets GitHub mint the OIDC token crates.io exchanges for a short-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
